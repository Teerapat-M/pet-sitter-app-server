name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pet_sitter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pet_sitter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pet_sitter
      # Placeholders so tests that import the Supabase client can load. Not a live project.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:verify
      - name: Migrations are idempotent
        run: npm run db:migrate && npm run db:seed
